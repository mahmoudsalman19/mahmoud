<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self Inspection Call Script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a live-call console. Pick a vertical, then read top-down through 5 call steps while a side panel tracks the 3 qualifiers. */
/* Matched to the Self Inspection platform deck: white and pale grey panels, black type, Self Inspection Blue #014CF2 accents, black for dark mode, Inter throughout. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #000000;
  --muted: #5E6068;
  --line: #E2E4E6;
  --accent: #014CF2;
  --accent-soft: #EEF3FE;
  --accent-ink: #FFFFFF;
  --say: #F4F5F5;
  --say-ink: #000000;
  --good: #1B7A47;
  --good-soft: #E3F2E9;
  --warn: #9A5B00;
  --warn-soft: #FBF0DC;
  --bad: #B3362B;
  --bad-soft: #FAE4E1;
  --font-display: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
.logo { height: 24px; width: auto; display: block; }
.logo-dark { display: none; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.topbar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand-sub { font-weight: 600; color: var(--muted); font-size: 14px; border-left: 1px solid var(--line); padding-left: 8px; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }

/* Picker */
.picker { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
.picker h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 400; letter-spacing: -0.03em; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.picker p.lead { color: var(--muted); margin: 6px 0 22px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card-pick { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 6px; align-content: start; transition: border-color .15s, transform .15s; }
.card-pick:hover { border-color: var(--accent); transform: translateY(-1px); }
.card-pick .row { display: flex; justify-content: space-between; align-items: center; }
.card-pick h2 { font-size: 18px; }
.key { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); }
.card-pick .who { font-size: 13px; color: var(--muted); }
.card-pick .hook { font-size: 13.5px; }
.tag-new { font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 1px 6px; }

/* Script view */
.wrap { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } .side { order: -1; position: static !important; } }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px; margin-bottom: 12px; }
.head h1 { font-size: 34px; font-weight: 400; letter-spacing: -0.03em; }
.head .who { color: var(--muted); font-size: 13.5px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 12px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; display: grid; gap: 10px; }
.step-h { display: flex; align-items: center; gap: 10px; }
.num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 13px; display: grid; place-items: center; flex: none; }
.step-h h2 { font-size: 17px; }
.step-h .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
.say { background: var(--say); color: var(--say-ink); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 16px; line-height: 1.45; font-weight: 500; }
.say::before { content: "SAY"; display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--accent); margin-bottom: 2px; }
.say.soft { background: transparent; border: 1px dashed var(--line); border-radius: 8px; color: var(--ink); font-size: 15px; font-weight: 400; }
.say.soft::before { content: "OR"; color: var(--muted); }
.label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
ul.qs { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.branch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 560px) { .branch { grid-template-columns: 1fr; } }
.branch div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.branch b { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.pick-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pill-btn { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.pill-btn:hover { border-color: var(--accent); }
.pill-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pains { display: grid; gap: 6px; }
.pain { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.pain:hover { border-color: var(--accent); }
.pain b { font-size: 14.5px; }
.pain span { font-size: 13px; color: var(--muted); }
.pain[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.proof { border-left: 3px solid var(--good); background: var(--good-soft); border-radius: 0 8px 8px 0; padding: 8px 12px; font-size: 14px; }
.caution { border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 14px; }
.note { font-size: 13px; color: var(--muted); }

/* Side tracker */
.side { position: sticky; top: 70px; display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.panel h3 { font-size: 15px; }
.q { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.q:last-of-type { border-bottom: none; padding-bottom: 0; }
.q .top { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.q.done .dot { background: var(--good); border-color: var(--good); }
.q .val { font-size: 13px; color: var(--muted); }
.q.done .val { color: var(--ink); }
.vol { display: flex; gap: 8px; align-items: center; }
.vol input { width: 90px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.fit { font-size: 12px; font-weight: 600; border-radius: 4px; padding: 2px 7px; }
.fit.low { color: var(--bad); background: var(--bad-soft); }
.fit.ok { color: var(--warn); background: var(--warn-soft); }
.fit.strong, .fit.top { color: var(--good); background: var(--good-soft); }
.status { border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: 14px; display: grid; gap: 2px; }
.status small { font-weight: 400; font-size: 12.5px; }
.status.wait { background: var(--bg); color: var(--muted); }
.status.go { background: var(--good-soft); color: var(--good); }
.stat-list { display: grid; gap: 4px; font-size: 13px; }
.stat-list div { display: flex; justify-content: space-between; gap: 10px; }
.stat-list span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

/* Objections / competitors / email */
.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); margin-bottom: 10px; font-size: 14px; }
.obj { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
.obj summary { padding: 11px 14px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.obj summary::-webkit-details-marker { display: none; }
.obj summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); }
.obj[open] summary::after { content: "–"; }
.obj .body { padding: 0 14px 12px; display: grid; gap: 8px; }
.comp { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: grid; gap: 6px; }
.comp .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.comp h3 { font-size: 16px; }
.comp .what { font-size: 13px; color: var(--muted); }
.partner { font-size: 11px; font-weight: 600; color: var(--good); background: var(--good-soft); border-radius: 4px; padding: 1px 6px; }
.comp-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.comp-head h2 { font-size: 18px; }
.comp-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-bottom: 12px; }
.comp-btn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: 14.5px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.comp-btn:hover { border-color: var(--accent); }
.comp-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.comp-sel { border-color: var(--accent); }
.tpl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; display: grid; gap: 8px; }
.tpl .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tpl pre { white-space: pre-wrap; font-family: var(--font-body); font-size: 14.5px; margin: 0; background: var(--bg); border-radius: 8px; padding: 12px; }
ol.cad { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.copied { color: var(--good); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- Modern layer: white canvas, soft depth, viewfinder corners from the logo ---- */
:root { --shadow-sm: 0 1px 2px rgba(0,0,0,.05); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(16,24,40,.06); --shadow-lg: 0 2px 4px rgba(0,0,0,.04), 0 16px 40px rgba(1,76,242,.12); --radius: 16px; }
body { background: #FFFFFF; -webkit-font-smoothing: antialiased; }
.topbar { background: rgba(255,255,255,.82); backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--line); padding: 12px 24px; flex-wrap: nowrap; }
.chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(90deg, #000 92%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 92%, transparent); padding: 2px 24px 2px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { white-space: nowrap; background: #F4F5F5; border-color: transparent; padding: 6px 14px; transition: background .15s, color .15s; }
.chip:hover { background: #EAECEE; border-color: transparent; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn { border-radius: 999px; padding: 8px 16px; background: #fff; box-shadow: var(--shadow-sm); white-space: nowrap; }
.btn.primary { box-shadow: 0 6px 18px rgba(1,76,242,.28); }
@media (max-width: 720px) { .brand-sub { display: none; } .topbar { padding: 10px 16px; } }

.picker { padding: 56px 24px 72px; max-width: 1120px; }
.picker h1 { font-size: clamp(36px, 6vw, 60px); font-weight: 300; line-height: 1.05; }
.picker p.lead { font-size: 17px; margin: 14px 0 36px; max-width: 56ch; }
.grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card-pick { position: relative; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 22px 18px; box-shadow: var(--shadow-sm); gap: 8px; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
.card-pick:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: transparent; }
.card-pick h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.card-pick .hook { font-size: 14px; color: var(--ink); }
.key { background: #F4F5F5; border: none; border-radius: 6px; padding: 2px 7px; }
.go-arrow { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--accent); opacity: 0; transform: translateX(-4px); transition: opacity .2s, transform .2s; }
.card-pick:hover .go-arrow, .card-pick:focus-visible .go-arrow { opacity: 1; transform: none; }
.vf { position: absolute; inset: 8px; pointer-events: none; opacity: 0; transition: opacity .2s, inset .2s; }
.vf b { position: absolute; width: 14px; height: 14px; border-color: var(--accent); border-style: solid; border-width: 0; }
.vf b:nth-child(1) { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; }
.vf b:nth-child(2) { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; }
.vf b:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; }
.vf b:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; }
.card-pick:hover .vf, .card-pick:focus-visible .vf { opacity: 1; inset: -6px; }

.wrap { padding: 32px 24px 80px; gap: 28px; grid-template-columns: minmax(0, 1fr) 340px; }
.head { margin-bottom: 18px; }
.head h1 { font-size: clamp(32px, 4vw, 44px); font-weight: 300; }
.head .who { font-size: 15px; margin-top: 4px; }
.tabs { display: inline-flex; gap: 4px; background: #F4F5F5; border: none; border-radius: 999px; padding: 4px; margin-bottom: 20px; max-width: 100%; }
.tab { border: none; border-radius: 999px; padding: 8px 16px; font-size: 14px; }
.tab[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); border-bottom: none; }

.step { border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); gap: 14px; margin-bottom: 16px; }
.step-h h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.num { width: 30px; height: 30px; border-radius: 9px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 12px rgba(1,76,242,.25); }
.step-h .hint { background: #F4F5F5; border-radius: 999px; padding: 3px 10px; }
.say { border-radius: 0 12px 12px 0; padding: 14px 16px; font-size: 16.5px; line-height: 1.55; }
.say.soft { border-radius: 12px; border-style: dashed; }
.branch div { border-radius: 12px; background: #FAFAFA; border-color: var(--line); padding: 10px 12px; }
.pill-btn { background: #fff; padding: 6px 13px; }
.pain { border-radius: 12px; padding: 10px 12px; transition: border-color .15s, background .15s; }
.proof, .caution { border-radius: 0 12px 12px 0; }

.side { top: 84px; gap: 16px; }
.panel { border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; gap: 12px; }
.panel h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.panel-h { display: flex; justify-content: space-between; align-items: center; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.prog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.prog i { height: 6px; border-radius: 999px; background: #ECEEF0; transition: background .25s; }
.prog i.on { background: var(--accent); }
.vol input { background: #fff; border-radius: 8px; padding: 7px 10px; }
.status { border-radius: 12px; }
.status.wait { background: #F4F5F5; }
.q.done .dot { background: var(--accent); border-color: var(--accent); }
.status.go { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(1,76,242,.25); }
.obj, .comp, .tpl { border-radius: 14px; box-shadow: var(--shadow-sm); }
.comp-btn { border-radius: 12px; }
.search { border-radius: 999px; padding: 11px 16px; background: #F4F5F5; border-color: transparent; }
.search:focus { background: #fff; border-color: var(--accent); outline: none; }
.tpl pre { border-radius: 10px; }
</style>
</head>

const IND = [
  { id: "rental", name: "Rental", who: "Owner, GM, branch or fleet manager, damage/claims manager",

    processQ: "Everyone in rental does it a bit differently. What happens on your end when a car comes back?",
    follow: ["Who does the walkaround, counter staff or a lot attendant?", "Do you take photos? Where do they end up?", "How many returns a month, roughly?", "What happens with after-hours or key-drop returns?"],
    pains: [
      ["Disputed damage charges", "About 30% of legit claims get disputed and reversed when the documentation is weak"],
      ["Notes that don't hold up", "Handwritten slips and \"scratch, rear quarter\" lose the argument"],
      ["After-hours returns", "Key-drop or unattended returns with nobody there to inspect"],
      ["Proving pre-existing damage", "Hard to show the scratch wasn't there at pickup"],
      ["Uncollected damage revenue", "Chargebacks left on the table and nobody's measuring it"]

    dig: ["When a customer pushes back on a charge, how often do you actually win?", "How do you prove a scratch wasn't there at pickup?", "Roughly how much damage goes uncharged a month?"],
    value: "So with us, the renter or your counter staff do a 90-second walkaround on their phone, no app. AI flags every dent and scratch, an expert double-checks it, and it compares pickup vs return so you only charge for net new damage. You get a chargeback packet with the photos attached.",
    proof: "Avis Alaska runs it across 12 counters (121K+ inspections). Auto360 was live day one and saved ~410 counter hours. Plugs straight into RentWorks.",
    email: { moment: "damage at return", team: "renters or counter staff", proof: "Avis Alaska runs it across 12 counters", vm: "return inspections" } },

  { id: "dealer", name: "Dealerships", who: "GM, used car manager, appraiser, service or fixed ops manager",
    hook: "Trade-ins that show up different, recon surprises, slow appraisals",
    opener: "Hey [Name], it's Mahmoud from Self Inspection. I'll be quick, we're reaching out to dealership managers to see how you're handling trade-in appraisals and vehicle inspections going into 2027. You guys doing those today, or is it more eyeballing it?",
    processQ: "Walk me through a trade-in. Customer pulls up, what happens next?",
    follow: ["Who does the appraisal walkaround?", "How long from walk-in to a number?", "How many trades a month?", "Do you document anything for recon or wholesale?"],
    pains: [
      ["Car shows up different", "Customer says it's clean, drives in with damage. The offer drops, they get upset or walk, and you've lost the time"],
      ["Recon surprises", "Damage missed before the deal is desked averages about $400 a unit"],
      ["Slow appraisals", "A manual walkaround eats 30 to 45 minutes of someone's time"],
      ["Inconsistent grading", "The number depends on who did the walkaround"],
      ["Arbitration fights", "Wholesale disputes come down to what the car looked like when it left"],
      ["Blind auction buys", "Pay a risk premium or eat the hidden damage"]
    ],
    angle: { t: "Sight-unseen angle", s: "One we hear a lot: the customer tells you on the phone the car's clean, you give them a number, then it shows up with a cracked bumper and curb rash. Now the number drops, they're annoyed, maybe they walk, and your appraiser just burned an hour. With us you text them a link first. They do the walkaround from their driveway in 90 seconds, and you get the full report with photos and repair costs before they ever show up. So the number you give is the number that sticks. Does that happen to you guys?" },
    dig: ["How often does a car show up different from what the customer told you?", "When the number drops at the store, how often does the customer walk?", "How often does recon come back way over the estimate?", "Ever lose an arbitration because you couldn't prove condition?", "What does a slow appraisal cost you on the floor?"],
    value: "With us the customer can do the walkaround from home before they even show up, or your guy does it in about 90 seconds. AI flags and prices the damage, an expert checks it, and the condition report lands with the desk numbers. It stays on the VIN for recon and wholesale.",
    proof: "Company numbers: recon misses ~$400 down to ~$80 a unit, appraisals under 5 minutes, arbitration claims down ~60%, payback under 60 days at 50+ trades a month. Works with CDK, Reynolds, Dealertrack, Auto/Mate.",
    email: { moment: "trade-in appraisals", team: "appraisers or customers", proof: "dealers are cutting appraisals to under 5 minutes", vm: "trade-in appraisals" } },

  { id: "lender", name: "Lenders & lessors", who: "Lease-end or remarketing manager, asset recovery, VP ops",
    hook: "Excess-wear disputes and costly third-party inspectors",
    opener: "Hey [Name], it's Mahmoud from Self Inspection. I'll be quick, we're reaching out to lease-end and remarketing teams to see how you're handling lease-return inspections and excess wear going into 2027. Are you using third-party inspectors for that today?",
    processQ: "How does a lease return work on your side today, from notice to closing statement?",
    follow: ["Who does the inspection, and what does each one cost?", "How long until you get the report back?", "How many lease returns a month?", "Do repo or remarketing units go through the same process?"],
    pains: [

      ["Inspector judgment nobody can see", "Lessees can't verify it, so they push back"],
      ["Surprise charges at closing", "Customers feel blindsided"],
      ["Inconsistent across locations", "Results change by inspector, location and time of day"],

    dig: ["How many excess-wear disputes do you deal with a month?", "What's the all-in cost per inspection today?", "How long does a dispute take to resolve?"],

function fit(v) {
  const n = parseInt(v, 10);
  if (!v || isNaN(n)) return null;
  if (n < 10) return ["low", "Low fit, don't force it"];
  if (n < 100) return ["ok", "Workable"];
  if (n < 500) return ["strong", "Strong fit"];
  return ["top", "Top deal"];
}

  <div class="panel"><h3>If they ask "what do you guys do?"</h3><div class="say">${esc(WHAT2)}</div><div class="say soft">${esc(WHAT)}</div><div class="note">Then flip it back: how are you doing inspections today?</div></div>
  <div class="panel"><h3>Ask for</h3><div class="note" style="color:var(--ink)">${esc(i.who)}</div></div>
  <div class="panel"><h3>Numbers to drop</h3><div class="stat-list">${STATS.map(([a, b]) => `<div><span>${a}</span><span>${b}</span></div>`).join("")}</div></div>`;
}

function renderScript() {
  const i = cur;
  const tabs = [["script", "Script"], ["obj", "Objections"], ["comp", "Competitors"], ["mail", "Voicemail & email"]];
  const body = tab === "obj" ? objTab() : tab === "comp" ? compTab() : tab === "mail" ? mailTab(i) : scriptTab(i);
  $("#app").innerHTML = `
  <div class="wrap">
    <section>
      <div class="head"><div><h1>${esc(i.name)}</h1><div class="who">${esc(i.hook)}</div></div></div>
      <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join("")}</div>
      <div id="tabBody">${body}</div>
    </section>
    <aside class="side" id="side">${sidePanel(i)}</aside>
  </div>`;
  procTip();
}

function procTip() {
  const el = $("#procTip");
  if (!el) return;
  const tips = {
    "Hardware scanner": "Hardware line: keeping devices charged and having enough on busy days is usually a pain. You run into that?",
    "Competitor software": "Ask which one, then check the Competitors tab for the line.",
    "3rd-party inspector": "Ask: how long until you get the report back, and what does each one cost?",
    "Pen and paper": "Ask: do you take any photos? Where do they live? How do you prove damage was the customer's?",
    "Nothing formal": "Ask: is that because you don't need to, or just haven't had a good option?"
  };
  const t = tips[call.process];
  el.innerHTML = t ? `<div class="say soft">${esc(t)}</div>` : "";
}

function refreshSide() {
  const s = $("#side");
  if (!s) return;
  s.innerHTML = sidePanel(cur);
  const b = $("#bookLine"); if (b) b.textContent = bookLine();
}

function choose(id, keepCall) {
  const i = IND.find(x => x.id === id);
  if (!i) { cur = null; renderChips(); renderPicker(); return; }
  if (!keepCall && (!cur || cur.id !== id)) call.pains = new Set();
  cur = i; tab = "script";
  renderChips(); renderScript();
  try { if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id); } catch (err) {}
  window.scrollTo(0, 0);
}

function resetCall() {
  call = { process: null, volume: "", pains: new Set() }; compSel = null;
  tab = "script";
  renderScript(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const ind = e.target.closest("[data-ind]");
  if (ind) { choose(ind.dataset.ind); return; }
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.dataset.tab; renderScript(); return; }
  const p = e.target.closest("[data-proc]");
  if (p) {
    call.process = call.process === p.dataset.proc ? null : p.dataset.proc;
    document.querySelectorAll("[data-proc]").forEach(b => b.setAttribute("aria-pressed", b.dataset.proc === call.process));
    if (call.process === "Competitor software") { tab = "comp"; renderScript(); window.scrollTo(0, 0); return; }
    procTip(); refreshSide(); return;
  }
  const cp = e.target.closest("[data-comp]");
  if (cp) { compSel = compSel === cp.dataset.comp ? null : cp.dataset.comp; renderScript(); return; }
  const pn = e.target.closest("[data-pain]");
  if (pn) {
    const k = pn.dataset.pain;
    call.pains.has(k) ? call.pains.delete(k) : call.pains.add(k);
    pn.setAttribute("aria-pressed", call.pains.has(k));
    refreshSide(); return;
  }
  const c = e.target.closest("[data-copy]");
  if (c) {
    const txt = c.dataset.copy === "vm" ? vmText(cur) : emailText(cur);
    const done = ok => { c.textContent = ok ? "Copied" : "Select and copy"; c.classList.toggle("copied", ok); setTimeout(() => { c.textContent = "Copy"; c.classList.remove("copied"); }, 1800); };
    try { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); } catch (err) { done(false); }
    return;
  }
  if (e.target.id === "newCall") { resetCall(); return; }
  if (e.target.closest("#home")) { cur = null; try { history.replaceState(null, "", location.pathname + location.search); } catch (err) {} renderChips(); renderPicker(); }
});

document.addEventListener("input", e => {
  if (e.target.id === "vol") {
    call.volume = e.target.value;
    const f = fit(call.volume);
    $("#fitPill").innerHTML = f ? `<span class="fit ${f[0]}">${f[1]}</span>` : "";
    const q = e.target.closest(".q"); q.classList.toggle("done", !!f);
    const ready = !!call.process && !!f && call.pains.size > 0;
    const flags = [!!call.process, !!f, call.pains.size > 0];
    $("#prog").innerHTML = flags.map(x => `<i class="${x ? "on" : ""}"></i>`).join("");
    $("#qCount").textContent = flags.filter(Boolean).length + "/3";
    const st = $(".status");
    st.className = "status " + (ready ? "go" : "wait");
    st.innerHTML = ready ? "Ready to book<small>Go to step 5 and ask for the calendar.</small>" : "Keep digging<small>Get all three before you ask for the meeting.</small>";
  }
  if (e.target.id === "objSearch") {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll("#objList .obj").forEach(d => {
      const hit = !q || d.dataset.text.includes(q);
      d.hidden = !hit;
      if (q && hit) d.open = true;
    });
  }
});

document.addEventListener("keydown", e => {
  if (cur || e.target.matches("input, textarea")) return;
  const n = e.key === "0" ? 10 : parseInt(e.key, 10);
  if (n >= 1 && n <= IND.length) choose(IND[n - 1].id);
});

window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (!id) { cur = null; renderChips(); renderPicker(); }
  else if (!cur || cur.id !== id) choose(id);
});

/* start */
(function init() {
  const id = location.hash.slice(1);
  if (id && IND.some(i => i.id === id)) choose(id); else { renderChips(); renderPicker(); }
})();
</script>
</body>
</html>
